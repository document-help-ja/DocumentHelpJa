<!DOCTYPE html>
<html lang="en-JM">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Laura Clarke | Executive Administrative Concierge</title>
  <meta name="description" content="Connect with Laura Clarke Administrative Services. Save contact info, chat directly on WhatsApp, or explore our document concierge services.">
  <meta name="theme-color" content="#0B1A28">

  <!-- FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       1. LUXURY DESIGN TOKENS
       ========================================================= */
    :root {
      --bg-dark: #0B1A28;
      --card-bg: rgba(15, 37, 55, 0.85);
      --gold: #C89B3C;
      --gold-light: #F3D594;
      --gold-grad: linear-gradient(135deg, #D4AF37 0%, #C89B3C 50%, #9A7228 100%);
      --gold-glow: rgba(200, 155, 60, 0.35);
      --wa-green: #128C7E;
      --wa-grad: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      --paper: #FFFFFF;
      --text-light: #F8FAFC;
      --text-muted: #94A3B8;
      --border-line: rgba(200, 155, 60, 0.25);
      --glass-border: rgba(255, 255, 255, 0.12);
      
      --sans: "Inter", system-ui, -apple-system, sans-serif;
      --serif: "Playfair Display", Georgia, serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    
    body {
      margin: 0;
      font-family: var(--sans);
      background: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient Background Mesh Glow */
    body::before {
      content: "";
      position: absolute;
      top: -10%;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(200, 155, 60, 0.15) 0%, rgba(11, 26, 40, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* =========================================================
       2. GLASSMORPHISM CONTAINER
       ========================================================= */
    .card-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 40px 24px 32px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    /* Profile Avatar with Gold Halo */
    .avatar-frame {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 20px;
    }
    
    .avatar-frame::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: var(--gold-grad);
      z-index: -1;
      box-shadow: 0 0 20px var(--gold-glow);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: var(--bg-dark);
      display: block;
    }

    /* Typography */
    .profile-name {
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 700;
      color: #FFFFFF;
      margin: 0 0 6px;
      letter-spacing: -0.01em;
    }

    .profile-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--gold-light);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 6px;
    }

    .profile-sub {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 32px;
    }

    /* =========================================================
       3. INTERACTIVE BUTTONS
       ========================================================= */
    .action-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      min-height: 56px;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      border: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .btn-gold {
      background: var(--gold-grad);
      color: #0B1A28;
      box-shadow: 0 6px 20px var(--gold-glow);
    }
    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(200, 155, 60, 0.5);
    }

    .btn-wa {
      background: var(--wa-grad);
      color: #FFFFFF;
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.25);
    }
    .btn-wa:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(37, 211, 102, 0.4);
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-line);
      color: var(--text-light);
    }
    .btn-outline:hover {
      background: rgba(200, 155, 60, 0.12);
      border-color: var(--gold);
      color: var(--gold-light);
      transform: translateY(-2px);
    }

    /* =========================================================
       4. CONCIERGE SERVICES GRID
       ========================================================= */
    .services-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 32px 0 18px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--gold-light);
    }
    .services-header::before, .services-header::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--glass-border);
    }

    .services-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .svc-chip {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 12px 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-light);
      text-decoration: none;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 48px;
    }
    .svc-chip:hover {
      background: rgba(200, 155, 60, 0.1);
      border-color: var(--gold);
      color: #FFFFFF;
      transform: scale(1.02);
    }

    .icon { width: 20px; height: 20px; fill: currentColor; flex-shrink: 0; }

    /* Footer */
    .card-footer {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid var(--glass-border);
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

        <svg class="icon" viewBox="0 0 24 24"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.64.08-.3-.15-1.26-.46-2.39-1.48-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.6.13-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.07c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.7.63.71.22 1.36.19 1.87.12.57-.09 1.76-.72 2.01-1.42.25-.69.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35m-5.42 7.4h-.01a9.87 9.87 0 0 1-5.03-1.37l-.36-.22-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.88 9.89-9.88 2.64 0 5.12 1.03 6.99 2.9a9.83 9.83 0 0 1 2.89 6.99c0 5.45-4.44 9.88-9.88 9.88m8.41-18.3A11.82 11.82 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.69 1.45h.01c6.55 0 11.89-5.34 11.89-11.89 0-3.18-1.24-6.17-3.48-8.41Z"/></svg>

      <!-- 3. MAIN WEBSITE -->
      <a href="/" class="btn btn-outline">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
        Explore Website

  <!-- SCRIPT FOR CLEAN VCARD DOWNLOAD -->
  <script>
    function downloadVCard() {
      const vcardData = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'N:Clarke;Laura;;;',
        'FN:Laura Clarke',
        'ORG:Laura Clarke Administrative Services',
        'TITLE:Lead Administrative Concierge',
        'TEL;TYPE=CELL,VOICE:+18765612614',
        'EMAIL:info@documenthelpja.com',
        'URL:https://documenthelpja.com',
        'NOTE:Independent Jamaican Document Pre-Audit & Representation Concierge.',
        'END:VCARD'
      ].join('\r\n');

      const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = window.URL.createObjectURL(blob);
      link.setAttribute('download', 'Laura_Clarke_Concierge.vcf');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
