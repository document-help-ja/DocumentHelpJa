<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Ulrica Clarke, MSW - online counselling and School Success Skills sessions.">
<title>Ulrica Clarke Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one calm column; a sideways deck of service cards, contact pinned below */
:root{
  --cream:#F7F4EE; --sand:#E9E1D2; --sage:#4F7360; --sage-soft:#DCE6DD;
  --navy:#1F2E3D; --gold:#B08D57; --gold-ink:#7A5E33; --muted:#5B6672; --card:#FFFDF9;
  --display:'Source Serif 4',Georgia,'Times New Roman',serif;
  --body:'Figtree','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--cream);color:var(--navy);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.mark{width:52px;height:52px;border-radius:50%;background:var(--sage);display:flex;align-items:center;justify-content:center}
h1{font-family:var(--display);font-weight:500;font-size:30px;line-height:1.15;margin:8px 0 0;text-wrap:balance}
.role{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-ink);font-weight:600}
.hint{font-size:14px;color:var(--muted);margin:0}
.deck{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:4px max(16px,env(safe-area-inset-left,0px)) 8px}
.deck::-webkit-scrollbar{display:none}
.card{flex:none;width:min(82vw,340px);scroll-snap-align:center;background:var(--card);border:1px solid var(--sand);border-radius:22px;padding:24px 22px;display:flex;flex-direction:column;gap:14px;min-height:500px;overflow:hidden}
.art{position:relative;margin:-24px -22px 4px;border-radius:21px 21px 0 0;overflow:hidden;line-height:0}
.art svg{width:100%;height:auto;display:block}
.art .tag{position:absolute;top:14px;left:16px;background:var(--card);line-height:1.4}
.hook{font-family:var(--display);font-style:italic;font-size:18px;line-height:1.35;color:var(--sage)}
.tag{align-self:flex-start;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-ink);border:1.5px solid var(--gold);border-radius:999px;padding:4px 12px;font-weight:600}
.ico{width:46px;height:46px;border-radius:50%;background:var(--sage-soft);display:flex;align-items:center;justify-content:center}
.card h2{font-family:var(--display);font-weight:500;font-size:26px;line-height:1.2;margin:0;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:15px}
.card ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.card li{display:flex;gap:10px;font-size:15px}
.card li svg{flex:none;margin-top:3px}
.meta{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--navy)}
.meta span{display:flex;align-items:center;gap:8px}
.ask{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--sage);color:#fff;text-decoration:none;border-radius:999px;padding:12px 16px;font-weight:600;font-size:15px}
.ask:focus-visible,.nav button:focus-visible,.copy:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.nav{display:flex;align-items:center;justify-content:center;gap:14px}
.nav button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--sage);background:transparent;color:var(--sage);cursor:pointer;display:flex;align-items:center;justify-content:center}
.dots{display:flex;gap:7px}
.dots i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--sage);display:block}
.dots i.on{background:var(--sage)}
.contact{background:var(--navy);color:var(--cream);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;text-align:center}
.contact q{font-family:var(--display);font-style:italic;font-size:19px;quotes:none}
.num{font-size:24px;font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums;user-select:all}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.contact .ask{background:var(--cream);color:var(--navy)}
.copy{border:1.5px solid var(--sage-soft);background:transparent;color:var(--cream);border-radius:999px;padding:11px 18px;font:600 15px var(--body);cursor:pointer}
footer{text-align:center;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.deck{scroll-behavior:auto}}
</style>

</head>
<body>
<div class="wrap">
<header>
  <div class="mark" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F7F4EE" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V11"/><path d="M12 11C12 7 9 5 5 5c0 4 3 6 7 6z"/><path d="M12 14c0-3.5 2.5-5.5 7-5.5 0 3.5-2.5 5.5-7 5.5z"/><path d="M8 21h8"/></svg></div>
  <h1>Ulrica Clarke, MSW</h1>
  <div class="role">Professional counselling services</div>
  <p class="hint">Swipe to see each service</p>
</header>

<div class="deck" id="deck" aria-label="Services"></div>

<div class="nav">
  <button type="button" id="prev" aria-label="Previous service"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
  <div class="dots" id="dots" aria-hidden="true"></div>
  <button type="button" id="next" aria-label="Next service"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
</div>

<section class="contact">
  <q>Let's connect and work through it together.</q>
  <div>
    <div style="font-size:13px;color:var(--sage-soft)">WhatsApp</div>
    <div class="num" id="num">876-428-4772</div>
  </div>
  <div class="row">
    <a class="ask" href="https://wa.me/18764284772" target="_blank" rel="noopener">Message on WhatsApp</a>
    <button type="button" class="copy" id="copy">Copy number</button>
  </div>
</section>


<p style="text-align:center;font-size:12px;color:var(--muted);margin:0">Page by <a href="https://documenthelpja.com" style="color:inherit">Laura Clarke Administrative Services</a></p>
</div>

<script>
const WA='18764284772';
const leaf='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4F7360" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V11"/><path d="M12 11C12 7 9 5 5 5c0 4 3 6 7 6z"/><path d="M12 14c0-3.5 2.5-5.5 7-5.5 0 3.5-2.5 5.5-7 5.5z"/></svg>';
const heart='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4F7360" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>';
const people='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4F7360" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M15 14.3c3 .1 5.5 2.4 5.5 5.7"/></svg>';
const check='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B08D57" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>';
const laptop='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4F7360" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></svg>';
const SK=['#8D5A3B','#A86F4C','#6B4430','#B98260'];
function P(cx,base,h,skin,shirt){const r=h*.14,hy=base-h+r;const top=hy+r+3,w=h*.42;
 return `<circle cx="${cx}" cy="${hy}" r="${r}" fill="${skin}"/><path d="M${cx-w/2} ${base}V${top+w*.35}a${w*.35} ${w*.35} 0 0 1 ${w*.35}-${w*.35}h${w*.3}a${w*.35} ${w*.35} 0 0 1 ${w*.35} ${w*.35}V${base}z" fill="${shirt}"/>`}
const G=(bg,inner)=>`<svg viewBox="0 0 300 160" aria-hidden="true"><rect width="300" height="160" fill="${bg}"/>${inner}<rect y="140" width="300" height="20" fill="#E9E1D2"/></svg>`;
const heartP=(x,y,s,c)=>`<path transform="translate(${x} ${y}) scale(${s})" d="M0 6C0 2 3 0 6 0c2 0 3.5 1.2 4 2.5C10.5 1.2 12 0 14 0c3 0 6 2 6 6 0 6-10 12-10 12S0 12 0 6z" fill="${c}"/>`;
const ART={
 school:G('#DCE6DD',`<circle cx="245" cy="38" r="18" fill="#F2D9A6"/>${P(125,118,72,SK[0],'#4F7360')}<rect x="55" y="104" width="190" height="10" rx="3" fill="#1F2E3D"/><rect x="70" y="114" width="8" height="26" fill="#1F2E3D"/><rect x="222" y="114" width="8" height="26" fill="#1F2E3D"/><rect x="175" y="92" width="44" height="7" rx="2" fill="#B08D57"/><rect x="179" y="85" width="38" height="7" rx="2" fill="#4F7360"/><rect x="176" y="78" width="40" height="7" rx="2" fill="#E9E1D2" stroke="#B08D57"/><path d="M80 104l14-22h22l-8 22z" fill="#F7F4EE" stroke="#1F2E3D" stroke-width="2"/>`),
 parent:G('#E9E1D2',`<path d="M70 140V80l80-48 80 48v60" fill="none" stroke="#FFFDF9" stroke-width="10" stroke-linejoin="round"/>${P(130,140,96,SK[1],'#1F2E3D')}${P(180,140,60,SK[2],'#B08D57')}<path d="M147 112q8 6 17 2" stroke="${SK[1]}" stroke-width="6" fill="none" stroke-linecap="round"/>`),
 child:G('#DCE6DD',`${P(120,140,74,SK[3],'#4F7360')}${P(178,140,58,SK[0],'#B08D57')}<path d="M168 22h86a10 10 0 0 1 10 10v26a10 10 0 0 1-10 10h-60l-14 12v-12h-12a10 10 0 0 1-10-10V32a10 10 0 0 1 10-10z" fill="#FFFDF9"/>${heartP(201,34,1.2,'#B08D57')}`),
 anger:G('#E9E1D2',`<path d="M48 92a22 22 0 0 1 8-42 28 28 0 0 1 52 6 18 18 0 0 1 4 36z" fill="#5B6672"/><path d="M80 92l-10 20h12l-8 20" stroke="#B08D57" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M132 80h40m-12-12l12 12-12 12" stroke="#1F2E3D" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="232" cy="80" r="26" fill="#F2D9A6"/><g stroke="#B08D57" stroke-width="4" stroke-linecap="round"><path d="M232 38v-10M232 132v-10M190 80h-10M284 80h-10M202 50l-7-7M269 117l-7-7M262 50l7-7M195 117l7-7"/></g>`),
 stress:G('#DCE6DD',`<g fill="none" stroke="#4F7360" stroke-width="2.5"><circle cx="150" cy="70" r="34" opacity=".55"/><circle cx="150" cy="70" r="52" opacity=".35"/><circle cx="150" cy="70" r="70" opacity=".18"/></g>${P(150,140,88,SK[2],'#B08D57')}<path d="M104 140q46-18 92 0" fill="#1F2E3D"/>`),
 family:G('#E9E1D2',`${heartP(130,14,2,'#B08D57')}${P(108,140,96,SK[1],'#1F2E3D')}${P(150,140,56,SK[3],'#4F7360')}${P(192,140,90,SK[0],'#B08D57')}`),
 grief:G('#DCE6DD',`<path d="M40 140a110 110 0 0 1 220 0z" fill="#F2D9A6" opacity=".7"/>${P(125,140,86,SK[2],'#1F2E3D')}${P(178,140,90,SK[1],'#4F7360')}<path d="M163 88q-12-2-24 2" stroke="${SK[1]}" stroke-width="7" fill="none" stroke-linecap="round"/>`)
};
const services=[
 {tag:'Special',art:'school',title:'School Success Skills',hook:'Set your child up for a great academic year.',points:['Building effective study habits','Creating a realistic, balanced study schedule','Tackling assignments without the overwhelm']},
 {tag:'Parents',art:'parent',title:'Basic parenting skills',hook:'Calmer homes start with small changes.',text:'Practical tools for everyday parenting, from routines to talking so children listen.'},
 {tag:'Children',art:'child',title:'Child behaviour support',hook:"When your child is struggling, you don't have to figure it out alone.",text:"Understand what's behind the behaviour and how to respond."},
 {tag:'Children',art:'anger',title:'Managing aggression',hook:'From outbursts to calmer days.',text:'Help to handle anger and big feelings in healthier ways.'},
 {tag:'Wellbeing',art:'stress',title:'Stress management',hook:'Feeling stretched thin?',text:'Simple ways to cope with pressure at home, work or school.'},
 {tag:'Families',art:'family',title:'General family counselling',hook:'Stronger together.',text:'A safe space for families to talk, listen and work things out.'},
 {tag:'Support',art:'grief',title:'Grief and trauma support',hook:"You don't have to carry it alone.",text:'Gentle support after loss or a painful experience.'}
];
const deck=document.getElementById('deck'),dots=document.getElementById('dots');
services.forEach((s,i)=>{
  const msg=encodeURIComponent(`Hi Ms. Clarke, I'd like to know more about ${s.title}.`);
  const el=document.createElement('article');el.className='card';
  el.innerHTML=`<div class="art">${ART[s.art]}<span class="tag">${s.tag}</span></div><h2>${s.title}</h2><div class="hook">${s.hook}</div>`+
   (s.text?`<p>${s.text}</p>`:'')+
   (s.points?`<ul>${s.points.map(p=>`<li>${check}<span>${p}</span></li>`).join('')}</ul>`:'')+
   `<div class="meta"><span>${laptop}100% online · Fees by consultation</span></div>`+
   `<a class="ask" href="https://wa.me/${WA}?text=${msg}" target="_blank" rel="noopener">Ask on WhatsApp</a>`;
  deck.appendChild(el);
  const d=document.createElement('i');if(!i)d.className='on';dots.appendChild(d);
});
const cards=[...deck.children];
function current(){const c=deck.scrollLeft+deck.clientWidth/2;let best=0,bd=1e9;cards.forEach((k,i)=>{const m=k.offsetLeft+k.offsetWidth/2;const d=Math.abs(m-c);if(d<bd){bd=d;best=i}});return best}
function go(i){i=Math.max(0,Math.min(cards.length-1,i));const k=cards[i];deck.scrollTo({left:k.offsetLeft-(deck.clientWidth-k.offsetWidth)/2,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
deck.addEventListener('scroll',()=>{const c=current();[...dots.children].forEach((d,i)=>d.className=i===c?'on':'')},{passive:true});
document.getElementById('prev').onclick=()=>go(current()-1);
document.getElementById('next').onclick=()=>go(current()+1);
document.getElementById('copy').onclick=async e=>{const b=e.currentTarget;try{await navigator.clipboard.writeText('876-428-4772');b.textContent='Copied'}catch(_){const r=document.createRange();r.selectNodeContents(document.getElementById('num'));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Number selected'}setTimeout(()=>b.textContent='Copy number',2000)};
</script>

</body>
</html>
